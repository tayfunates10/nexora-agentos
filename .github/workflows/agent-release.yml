# The standard agent release pipeline.
#
# Agents and connectors are manifests, not console code, so this workflow runs only when
# a package changes. Publishing sends the new version to the platform API, which refuses
# to overwrite one that already exists. Nothing here rebuilds or redeploys the console.
name: Agent Release
on:
  pull_request:
    paths:
      - 'agents/**'
      - 'connectors/**'
      - 'apps/api/src/nexora_api/agent_manifest.py'
      - 'apps/api/src/nexora_api/integration_manifest.py'
      - 'scripts/publish_catalog.py'
      - 'scripts/release_scope.py'
      - '.github/workflows/agent-release.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'connectors/**'
      - 'apps/api/src/nexora_api/agent_manifest.py'
      - 'apps/api/src/nexora_api/integration_manifest.py'
      - 'scripts/publish_catalog.py'
  workflow_dispatch:
    inputs:
      agents:
        description: 'Agent slugs to publish, or * for all'
        default: '*'
      connectors:
        description: 'Connector ids to publish, or * for all'
        default: '*'
permissions:
  contents: read
concurrency:
  # Publishing is ordered, never cancelled: a half-published catalog is worse than a slow
  # one, and a cancelled run could leave an agent referencing a connector that never
  # reached the registry.
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.scope.outputs.agents }}
      connectors: ${{ steps.scope.outputs.connectors }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - name: Test the release tooling
        run: python -m unittest discover -s scripts -p 'test_release_scope.py' -p 'test_publish_catalog.py'
      - name: Validate every package against the published contract
        run: python scripts/publish_catalog.py --check
      - name: Test the manifest contracts
        run: pytest apps/api/tests/test_agent_manifest.py -q
      - name: Resolve which packages this change releases
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MANUAL_AGENTS: ${{ inputs.agents }}
          MANUAL_CONNECTORS: ${{ inputs.connectors }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'agents=%s\n' "$MANUAL_AGENTS" >> "$GITHUB_OUTPUT"
            printf 'connectors=%s\n' "$MANUAL_CONNECTORS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/release_scope.py --base "$BASE" > release-scope.json
          cat release-scope.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          scope = json.load(open("release-scope.json"))
          print("agents=" + " ".join(scope["agents"]))
          print("connectors=" + " ".join(scope["connectors"]))
          PY

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (needs.validate.outputs.agents != '' || needs.validate.outputs.connectors != '')
    runs-on: ubuntu-latest
    # Attach protection rules here to require an approval before the catalog moves.
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - name: Publish the changed packages
        env:
          # A platform administrator's token, held by the environment and never printed.
          NEXORA_PLATFORM_TOKEN: ${{ secrets.NEXORA_PLATFORM_TOKEN }}
          NEXORA_PLATFORM_URL: ${{ vars.NEXORA_PLATFORM_URL }}
          AGENTS: ${{ needs.validate.outputs.agents }}
          CONNECTORS: ${{ needs.validate.outputs.connectors }}
        run: |
          set -euo pipefail
          test -n "$NEXORA_PLATFORM_URL" && test -n "$NEXORA_PLATFORM_TOKEN"
          python scripts/publish_catalog.py --publish \
            --base-url "$NEXORA_PLATFORM_URL" \
            ${AGENTS:+--agents $AGENTS} \
            ${CONNECTORS:+--connectors $CONNECTORS}
