name: Local Test Export

on:
  push:
    branches:
      - chore/local-test-export-20260922

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: nexora-agentos-source
          path: .
          include-hidden-files: true
          retention-days: 1
