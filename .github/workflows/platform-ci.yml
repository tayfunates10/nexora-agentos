name: Platform CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXORA_DATABASE_URL: postgresql://nexora:ci-only-password@localhost:5432/nexora
      NEXORA_REDIS_URL: redis://localhost:6379/0
      NEXORA_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - run: python scripts/sync_skills.py --check
      - run: ruff check apps/api && ruff format --check apps/api
      - name: Initialize pgvector
        run: |
          python - <<'PY'
          import os
          import psycopg
          from pathlib import Path
          with psycopg.connect(os.environ['NEXORA_DATABASE_URL']) as connection:
              connection.execute(Path('infra/postgres/001_extensions.sql').read_text())
          PY
      - run: python -m nexora_api.migrate
      - run: pytest apps/api/tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:web && npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API and server-rendered web
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/v1/health/ready
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/ -o /tmp/nexora.html
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/nexora.html').read_text()
          assert 'All foundation services are reachable.' in html
          assert 'No agent runs yet' in html
          PY
      - name: Stop containers
        if: always()
        run: docker compose down
