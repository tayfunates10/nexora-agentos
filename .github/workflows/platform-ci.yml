name: Platform CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXORA_DATABASE_URL: postgresql://nexora:ci-only-password@localhost:5432/nexora
      NEXORA_REDIS_URL: redis://localhost:6379/0
      NEXORA_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - run: python scripts/sync_skills.py --check
      - name: Test staging acceptance contracts
        run: python -m unittest discover -s scripts -p 'test_staging_*.py'
      - name: Check migration history is append-only
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}"
          python scripts/check_migrations.py --base FETCH_HEAD
      - run: ruff check apps/api && ruff format --check apps/api
      - name: Initialize pgvector
        run: |
          python - <<'PY'
          import os
          import psycopg
          from pathlib import Path
          with psycopg.connect(os.environ['NEXORA_DATABASE_URL']) as connection:
              connection.execute(Path('infra/postgres/001_extensions.sql').read_text())
          PY
      - run: python -m nexora_api.migrate
      - run: pytest apps/api/tests
  web:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:web && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @nexora/web
  manifests:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render Kustomize targets
        run: |
          for target in infra/k8s/base infra/k8s/migrate infra/k8s/overlays/production \
            infra/k8s/overlays/staging infra/k8s/overlays/staging/migrate; do
            kubectl kustomize "$target" > "/tmp/$(echo "${target#infra/k8s/}" | tr / -).yaml"
          done
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  /tmp/kubeconform.tgz" | sha256sum --check --strict
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: Validate rendered manifests
        run: |
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 \
            /tmp/base.yaml /tmp/migrate.yaml /tmp/overlays-production.yaml \
            /tmp/overlays-staging.yaml /tmp/overlays-staging-migrate.yaml
  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and test Prometheus rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 check rules /etc/prometheus/rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus prom/prometheus:v3.14.0 test rules tests.yml
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      NEXORA_METRICS_TOKEN: ci-only-metrics-token-0123456789
      NEXORA_GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-0123456789
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API and server-rendered web
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/v1/health/ready
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/ -o /tmp/nexora.html
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/nexora.html').read_text()
          assert 'All platform services are reachable.' in html
          assert 'Nothing runs unless you enable it' in html
          PY
      - name: Verify web runtime omits build package managers
        run: |
          docker compose run --rm --no-deps web sh -ceu '
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/local/lib/node_modules/corepack
            ! command -v npm
            ! command -v npx
            ! command -v corepack
          '
      - name: Verify guarded metrics exposition
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)" = 401
          curl --fail -H "Authorization: Bearer $NEXORA_METRICS_TOKEN" \
            http://localhost:8000/metrics | grep -q '^nexora_http_requests_total'
      - name: Verify opt-in worker service
        env:
          NEXORA_OPENAI_API_KEY: ci-only-placeholder-not-a-real-key
        run: |
          docker compose --profile worker up --build --wait --wait-timeout 180 worker
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            http://localhost:8001/api/v1/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/metrics)" = 401
          curl --fail -H "Authorization: Bearer $NEXORA_METRICS_TOKEN" \
            http://localhost:8001/metrics | grep -q '^nexora_slo_objective_ratio'
      - name: Verify opt-in monitoring stack
        run: |
          python scripts/prepare_monitoring_secrets.py
          docker compose -f compose.yaml -f compose.monitoring.yaml --profile worker config --quiet
          docker compose -f compose.yaml -f compose.monitoring.yaml --profile worker up -d --wait --wait-timeout 180 prometheus grafana
          python scripts/check_monitoring.py
      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml --profile worker down
