name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # A half-published release is worse than a slow one, so runs queue instead.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: Require green Platform CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's Platform CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY/actions/workflows/platform-ci.yml/runs"
          for attempt in $(seq 1 80); do
            response="$(gh api --method GET "$api" -f head_sha="$GITHUB_SHA" -f per_page=10)"
            run="$(printf '%s' "$response" | jq -c '
              [.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and (.event == "push" or .event == "workflow_dispatch"))]
              | sort_by(.created_at) | reverse | .[0] // empty
            ')"
            if [ -n "$run" ]; then
              status="$(printf '%s' "$run" | jq -r '.status')"
              conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
              echo "Platform CI: $status ${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            else
              echo "Platform CI for $GITHUB_SHA has not appeared yet."
            fi
            sleep 15
          done
          echo "Timed out waiting for Platform CI for $GITHUB_SHA" >&2
          exit 1

  # The console, the platform services and the standard agents release on separate
  # clocks. This job decides which images a change actually affects, so a console change
  # never reissues the API image and an agent package never rebuilds either of them.
  scope:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve the affected images
        id: resolve
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/release_scope.py --all > release-scope.json
          else
            python scripts/release_scope.py --base "$BASE" > release-scope.json
          fi
          cat release-scope.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          images = json.load(open("release-scope.json"))["images"]
          print("images=" + json.dumps([
              {"image": name,
               "dockerfile": f"apps/{'api' if name.endswith('api') else 'web'}/Dockerfile"}
              for name in images
          ]))
          PY

  publish:
    needs: scope
    if: needs.scope.outputs.images != '[]'
    runs-on: ubuntu-latest
    # Attach protection rules here to require an approval before anything is published.
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.images) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate to the registry
        # The job's short-lived token, not a stored credential.
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish with provenance and SBOM
        id: build
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE"
          # The container driver is what can attach attestations to the image.
          docker buildx create --name nexora --driver docker-container --use >/dev/null
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "$repository:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --provenance mode=max \
            --sbom true \
            --metadata-file /tmp/metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          test -n "$digest" && [ "$digest" != "null" ]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan immutable image digest
        env:
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_VERSION: 0.74.0
          TRIVY_CHECKSUMS_SHA256: bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821
        run: |
          set -euo pipefail
          base_url="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          checksums="/tmp/trivy_${TRIVY_VERSION}_checksums.txt"
          archive="/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          curl --fail --silent --show-error --location \
            "$base_url/trivy_${TRIVY_VERSION}_checksums.txt" \
            --output "$checksums"
          echo "$TRIVY_CHECKSUMS_SHA256  $checksums" | sha256sum --check --strict

          curl --fail --silent --show-error --location \
            "$base_url/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "$checksums" \
            | sed "s#  trivy_#  /tmp/trivy_#" \
            | sha256sum --check --strict

          tar -xzf "$archive" -C /tmp trivy
          docker pull "$REPOSITORY@$DIGEST" >/dev/null

          # Always surface every severe finding in the log for operator review.
          /tmp/trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "$REPOSITORY@$DIGEST"

          # Promotion is blocked for HIGH/CRITICAL findings that have a published fix.
          /tmp/trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$REPOSITORY@$DIGEST"
      - name: Sign GitHub provenance attestation
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signed provenance before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$REPOSITORY@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
      - name: Record how to promote this artifact
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo ""
            echo "\`$REPOSITORY@$DIGEST\`"
            echo ""
            echo "Release gates: immutable-digest CVE scan passed and signed provenance verified."
            echo ""
            echo "Promote with:"
            echo ""
            printf '%s\n' '```bash'
            echo "python scripts/promote_release.py \\"
            echo "  --image nexora/${IMAGE#nexora-} \\"
            echo "  --new-name $REPOSITORY \\"
            echo "  --digest $DIGEST"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
