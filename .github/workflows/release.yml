name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A half-published release is worse than a slow one, so runs queue instead.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # Attach protection rules here to require an approval before anything is published.
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nexora-api
            dockerfile: apps/api/Dockerfile
          - image: nexora-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate to the registry
        # The job's short-lived token, not a stored credential.
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish with provenance and SBOM
        id: build
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE"
          # The container driver is what can attach attestations to the image.
          docker buildx create --name nexora --driver docker-container --use >/dev/null
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "$repository:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --provenance mode=max \
            --sbom true \
            --metadata-file /tmp/metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          test -n "$digest" && [ "$digest" != "null" ]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan immutable image digest
        env:
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_VERSION: 0.74.0
          TRIVY_CHECKSUMS_SHA256: bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821
        run: |
          set -euo pipefail
          base_url="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          checksums="/tmp/trivy_${TRIVY_VERSION}_checksums.txt"
          archive="/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          curl --fail --silent --show-error --location \
            "$base_url/trivy_${TRIVY_VERSION}_checksums.txt" \
            --output "$checksums"
          echo "$TRIVY_CHECKSUMS_SHA256  $checksums" | sha256sum --check --strict

          curl --fail --silent --show-error --location \
            "$base_url/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "$checksums" \
            | sed "s#  trivy_#  /tmp/trivy_#" \
            | sha256sum --check --strict

          tar -xzf "$archive" -C /tmp trivy
          docker pull "$REPOSITORY@$DIGEST" >/dev/null

          # Always surface every severe finding in the log for operator review.
          /tmp/trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "$REPOSITORY@$DIGEST"

          # Promotion is blocked for HIGH/CRITICAL findings that have a published fix.
          /tmp/trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$REPOSITORY@$DIGEST"
      - name: Sign GitHub provenance attestation
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signed provenance before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$REPOSITORY@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
      - name: Record how to promote this artifact
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo ""
            echo "\`$REPOSITORY@$DIGEST\`"
            echo ""
            echo "Release gates: immutable-digest CVE scan passed and signed provenance verified."
            echo ""
            echo "Promote to staging first:"
            echo ""
            printf '%s\n' '```bash'
            echo "python scripts/promote_release.py \\"
            echo "  --environment staging \\"
            echo "  --image nexora/${IMAGE#nexora-} \\"
            echo "  --new-name $REPOSITORY \\"
            echo "  --digest $DIGEST"
            printf '%s\n' '```'
            echo ""
            echo "After staging acceptance, promote the same digest to production:"
            echo ""
            printf '%s\n' '```bash'
            echo "python scripts/promote_release.py \\"
            echo "  --environment production \\"
            echo "  --image nexora/${IMAGE#nexora-} \\"
            echo "  --new-name $REPOSITORY \\"
            echo "  --digest $DIGEST"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
