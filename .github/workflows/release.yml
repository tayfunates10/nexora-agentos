name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A half-published release is worse than a slow one, so runs queue instead.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # Attach protection rules here to require an approval before anything is published.
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nexora-api
            dockerfile: apps/api/Dockerfile
          - image: nexora-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate to the registry
        # The job's short-lived token, not a stored credential.
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish with provenance and SBOM
        id: build
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE"
          # The container driver is what can attach attestations to the image.
          docker buildx create --name nexora --driver docker-container --use >/dev/null
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "$repository:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --provenance mode=max \
            --sbom true \
            --metadata-file /tmp/metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          test -n "$digest" && [ "$digest" != "null" ]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record how to promote this artifact
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo ""
            echo "\`$REPOSITORY@$DIGEST\`"
            echo ""
            echo "Promote with:"
            echo ""
            echo '```bash'
            echo "python scripts/promote_release.py \\"
            echo "  --image nexora/${IMAGE#nexora-} \\"
            echo "  --new-name $REPOSITORY \\"
            echo "  --digest $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
