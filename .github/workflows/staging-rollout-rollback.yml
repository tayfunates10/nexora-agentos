name: Staging Rollout Rollback

on:
  workflow_dispatch:
    inputs:
      api_digest:
        description: Immutable nexora-api digest (sha256:...)
        required: true
        type: string
      web_digest:
        description: Immutable nexora-web digest (sha256:...)
        required: true
        type: string
      require_retrieval:
        description: Require retrieval during both smoke checks
        required: true
        type: boolean
        default: true
      exercise_approval:
        description: Exercise the configured approval fixture during both smoke checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A staging smoke must never race a rollout/rollback mutation.
  group: staging-acceptance
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure least-privilege staging context
        env:
          KUBECONFIG_CONTENT: ${{ secrets.NEXORA_STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_CONTENT"
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/nexora-staging-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/nexora-staging-kubeconfig" >> "$GITHUB_ENV"
          kubectl version --client
      - name: Exercise candidate rollout and rollback
        env:
          API_REPOSITORY: ${{ vars.NEXORA_STAGING_API_IMAGE }}
          WEB_REPOSITORY: ${{ vars.NEXORA_STAGING_WEB_IMAGE }}
          API_DIGEST: ${{ inputs.api_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          NEXORA_STAGING_API_URL: ${{ vars.NEXORA_STAGING_API_URL }}
          NEXORA_STAGING_WORKER_ADMIN_URL: ${{ vars.NEXORA_STAGING_WORKER_ADMIN_URL }}
          NEXORA_STAGING_WORKSPACE_ID: ${{ vars.NEXORA_STAGING_WORKSPACE_ID }}
          NEXORA_STAGING_AGENT_ID: ${{ vars.NEXORA_STAGING_AGENT_ID }}
          NEXORA_STAGING_PROMPT: ${{ inputs.exercise_approval && vars.NEXORA_STAGING_APPROVAL_PROMPT || vars.NEXORA_STAGING_PROMPT }}
          NEXORA_STAGING_EXPECT_TEXT: ${{ vars.NEXORA_STAGING_EXPECT_TEXT }}
          NEXORA_STAGING_EXPECT_SOURCE_KEY: ${{ inputs.require_retrieval && vars.NEXORA_STAGING_EXPECT_SOURCE_KEY || '' }}
          NEXORA_STAGING_APPROVAL_TOOL: ${{ inputs.exercise_approval && vars.NEXORA_STAGING_APPROVAL_TOOL || '' }}
          NEXORA_STAGING_REQUIRE_RETRIEVAL: ${{ inputs.require_retrieval }}
          NEXORA_STAGING_REQUIRE_OBSERVABILITY: 'true'
          NEXORA_STAGING_ACCESS_TOKEN: ${{ secrets.NEXORA_STAGING_ACCESS_TOKEN }}
          NEXORA_STAGING_METRICS_TOKEN: ${{ secrets.NEXORA_STAGING_METRICS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$API_REPOSITORY"
          test -n "$WEB_REPOSITORY"
          python scripts/staging_rollout_rollback.py \
            --api-image "$API_REPOSITORY@$API_DIGEST" \
            --web-image "$WEB_REPOSITORY@$WEB_DIGEST"
      - name: Remove staging kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/nexora-staging-kubeconfig}"
