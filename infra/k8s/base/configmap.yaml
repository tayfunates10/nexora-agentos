apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  # Non-secret process configuration. Credentials, connection strings and the
  # scrape token live in the nexora-secrets Secret, which is never committed.
  NEXORA_LOG_LEVEL: "INFO"
  NEXORA_OTEL_SAMPLE_RATIO: "1.0"
  NEXORA_OTEL_EXPORTER_ENDPOINT: ""
  NEXORA_AUTH_ISSUER: ""
  NEXORA_AUTH_AUDIENCE: ""
  # Empty means discover jwks_uri from the configured issuer. Set an HTTPS URL
  # only when the provider intentionally serves keys from a different origin.
  NEXORA_AUTH_JWKS_URL: ""
  NEXORA_AUTH_JWKS_CACHE_SECONDS: "300"
  NEXORA_AUTH_JWKS_MIN_REFRESH_SECONDS: "10"
  NEXORA_API_RATE_LIMIT_REQUESTS: "120"
  NEXORA_API_RATE_LIMIT_WINDOW_SECONDS: "60"
  # Which master key new credentials are sealed under. Several keys may be loaded at
  # once so a rotation can still read what the previous key sealed.
  NEXORA_SECRET_VAULT_ACTIVE_KEY: ""
  # Verified token subjects that may publish and roll out standard agents. This is the
  # only way platform administration is granted: no API call and no workspace role
  # implies it. Comma separated.
  NEXORA_PLATFORM_ADMIN_SUBJECTS: ""
  # The runtime contract standard agents declare a minimum against. It moves with the
  # platform, independently of any agent version.
  NEXORA_AGENT_RUNTIME_VERSION: "1.0.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-database-roles
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  # Capability roles are created once by the database administrator. They carry no
  # login credential; API/worker login identities inherit the corresponding role.
  NEXORA_DATABASE_API_ROLE: "nexora_api_runtime"
  NEXORA_DATABASE_WORKER_ROLE: "nexora_worker_runtime"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-worker-config
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  # Worker process settings, kept out of the shared map so the API is not handed
  # configuration it never reads.
  NEXORA_WORKER_ADMIN_PORT: "8001"
  NEXORA_WORKER_RUNTIME_CONFIG: "/etc/nexora/runtime.json"
  NEXORA_WORKER_SHUTDOWN_GRACE_SECONDS: "25"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-worker-runtime
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  # Operator-declared model profiles. A run cannot name a model, provider or tool
  # that is not listed here. Replace the workspace IDs, model and prices before
  # deploying; prices are micros per million tokens and enable spend accounting.
  runtime.json: |
    {
      "model_candidates": [
        {
          "provider": "openai",
          "model": "replace-with-a-model-your-account-can-call",
          "capabilities": ["text", "tools"],
          "quality_tier": 2,
          "input_micros_per_million_tokens": 3000000,
          "output_micros_per_million_tokens": 15000000
        }
      ],
      "profiles": {
        "default": {
          "allowed_workspaces": ["00000000-0000-0000-0000-000000000000"],
          "allowed_providers": ["openai"],
          "allowed_tools": [],
          "max_steps": 8
        }
      }
    }
