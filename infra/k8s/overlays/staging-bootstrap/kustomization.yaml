apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexora-staging
# Bootstrap creates the staging security/configuration boundary without starting
# a migration or any application workload. Secrets are injected after this step.
resources:
  - ../../base/namespace.yaml
  - ../../base/serviceaccount.yaml
  - ../../base/configmap.yaml
  - ../../base/networkpolicy.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: staging
patches:
  - target:
      kind: Namespace
      name: nexora
    patch: |
      - op: replace
        path: /metadata/name
        value: nexora-staging
